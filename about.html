<script>
  
    const text = "2nd-year Architecture student at Mimar Sinan Fine Arts University. Working between art, space, and digital media. Interested in collective spatial systems, visual narratives, and experimental representation.";
    
    const speed = 40; 
    let i = 0;

    // Daktilo fonksiyonu
    function typeWriter() {
        if (i < text.length) {
            document.getElementById("typewriter-text").innerHTML += text.charAt(i);
            i++;
            setTimeout(typeWriter, speed);
        }
    }

  
    window.onload = typeWriter;
</script>
